name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phar, zip, mbstring
          tools: composer

      - name: Lint
        run: |
          php -l packme
          php -l replaceme
          php -l replaceme5
          php -l build-phar.php

      - name: Build phar
        run: php -d phar.readonly=0 build-phar.php packme.phar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packme.phar --title "$GITHUB_REF_NAME" --generate-notes
